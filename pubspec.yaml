name: error_handling
description: >-
  Project-independent global error handling for Flutter: typed failures,
  Result<T>, Dio client with retry + correlation IDs, global crash hooks and
  a safe init-error screen.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  meta: ^1.11.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
